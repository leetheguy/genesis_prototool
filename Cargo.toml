[workspace]
resolver = "3"
members = ["crates/genesis-core", "crates/genesis-ui", "apps/bench", "apps/desktop", "apps/serve", "apps/web"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/leetheguy/genesis_prototool"
publish = false

[workspace.dependencies]
genesis-core = { path = "crates/genesis-core" }
leptos = "0.8.23"
regex-lite = "0.1.9"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = { version = "1.2.2", features = ["preserve_order"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
