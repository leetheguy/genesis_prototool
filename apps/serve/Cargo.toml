[package]
name = "genesis-serve"
version = "0.1.0"
description = "Genesis's server: hands out the renderer and each app's config, and writes the mirror."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
genesis-core.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
